<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoubtDock | Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --glass-bg: rgba(255, 255, 255, 0.85);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.5);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h2 { margin: 0; color: #1e293b; font-size: 28px; font-weight: 700; }
        .header p { color: #64748b; margin-top: 8px; font-size: 14px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #475569; font-weight: 600; font-size: 14px; }

        .input-group { position: relative; }
        .input-group i {
            position: absolute; left: 15px; top: 50%;
            transform: translateY(-50%); color: #94a3b8;
        }

        input {
            width: 100%; padding: 12px 15px 12px 45px;
            border: 1.5px solid #e2e8f0; border-radius: 12px;
            font-size: 15px; transition: all 0.3s;
            background: white; box-sizing: border-box;
        }

        input:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99,102,241,0.1);
        }

        .btn-login {
            width: 100%; background: var(--primary); color: white;
            padding: 14px; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 700; cursor: pointer;
            transition: 0.3s; margin-top: 10px;
        }

        .btn-login:hover {
            background: var(--primary-hover); transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(99,102,241,0.4);
        }

        .footer { text-align: center; margin-top: 25px; font-size: 14px; color: #64748b; }
        .footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .error-msg { background: #fee2e2; color: #dc2626; padding: 12px; border-radius: 10px; font-size: 13px; margin-bottom: 20px; display: none; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="header">
        <h2>Welcome Back</h2>
        <p>Enter your details to access DoubtDock</p>
    </div>

    <!-- We keep login.php as the handler -->
    <form action="login.php" method="POST">
        <div class="form-group">
            <label>Email Address</label>
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" name="email" placeholder="name@college.edu" required>
            </div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn-login">Sign In</button>
    </form>

    <div class="footer">
        Don't have an account? <a href="register.html">Create one</a>
    </div>
</div>

</body>
</html>
