<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoubtDock | Join Us</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --glass-bg: rgba(255, 255, 255, 0.85);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .reg-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(255,255,255,0.5);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h2 { margin: 0; color: #1e293b; font-size: 28px; font-weight: 700; }
        .header p { color: #64748b; margin-top: 8px; font-size: 14px; }

        .role-selection {
            display: flex; gap: 15px; margin-bottom: 25px;
        }

        .role-btn {
            flex: 1; position: relative;
        }

        .role-btn input {
            position: absolute; opacity: 0; cursor: pointer;
        }

        .role-label {
            display: block; padding: 12px; text-align: center;
            background: white; border: 1.5px solid #e2e8f0;
            border-radius: 12px; cursor: pointer; font-weight: 600;
            color: #475569; transition: 0.3s;
        }

        .role-btn input:checked + .role-label {
            border-color: var(--primary); background: rgba(99,102,241,0.05);
            color: var(--primary);
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; color: #475569; font-weight: 600; font-size: 13px; }

        input, select {
            width: 100%; padding: 10px 15px;
            border: 1.5px solid #e2e8f0; border-radius: 10px;
            font-size: 14px; transition: all 0.3s;
            background: white; box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99,102,241,0.1);
        }

        .btn-reg {
            width: 100%; background: var(--primary); color: white;
            padding: 14px; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 700; cursor: pointer;
            transition: 0.3s; margin-top: 10px;
        }

        .btn-reg:hover {
            background: var(--primary-hover); transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(99,102,241,0.4);
        }

        .footer { text-align: center; margin-top: 20px; font-size: 14px; color: #64748b; }
        .footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="reg-card">
    <div class="header">
        <h2>Create Account</h2>
        <p>Join the future of engineering mentorship</p>
    </div>

    <!-- register.php remains as the secure handler -->
    <form action="register.php" method="POST">
        <div class="role-selection">
            <label class="role-btn">
                <input type="radio" name="role" value="student" checked onchange="toggleMentorFields()">
                <div class="role-label">Student</div>
            </label>
            <label class="role-btn">
                <input type="radio" name="role" value="mentor" onchange="toggleMentorFields()">
                <div class="role-label">Mentor</div>
            </label>
        </div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="John Doe" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="name@college.edu" required>
        </div>

        <div class="form-group">
            <label>Branch</label>
            <select name="branch" required>
                <option value="CSE">Computer Science</option>
                <option value="ME">Mechanical</option>
                <option value="CE">Civil</option>
                <option value="ECE">Electronics</option>
            </select>
        </div>

        <div id="mentor-fields" style="display:none;">
            <div class="form-group">
                <label>Expertise (comma separated)</label>
                <input type="text" name="subject_experties" placeholder="Java, DBMS, OS">
            </div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-reg">Sign Up Now</button>
    </form>

    <div class="footer">
        Already have an account? <a href="login.html">Login</a>
    </div>
</div>

<script>
    function toggleMentorFields() {
        const role = document.querySelector('input[name="role"]:checked').value;
        const mentorFields = document.getElementById('mentor-fields');
        mentorFields.style.display = role === 'mentor' ? 'block' : 'none';
    }
</script>

</body>
</html>
