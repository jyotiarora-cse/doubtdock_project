<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mentor | Solve Doubts</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f5f3ff; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .task-card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .btn-open { background: #7c3aed; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .solve-area { display: none; margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px; }
        textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; }
        .btn-send { background: #22c55e; color: white; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>Pending Doubts</h2>

    <div class="task-card">
        <p><strong>Student ID #101:</strong> Please explain Photosynthesis.</p>
        <button class="btn-open" onclick="openDoubt(this)">View Doubt & Reply</button>
        
        <div class="solve-area">
            <textarea rows="3" placeholder="Write your expert answer here..."></textarea>
            <br>
            <button class="btn-send">Send Reply</button>
        </div>
    </div>
</div>

<script>
    function openDoubt(btn) {
        let area = btn.nextElementSibling;
        if (area.style.display === "block") {
            area.style.display = "none";
            btn.innerText = "View Doubt & Reply";
        } else {
            area.style.display = "block";
            btn.innerText = "Close Doubt";
        }
    }
</script>
</body>
</html>
