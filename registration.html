<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join DoubtDock | Step into the Future</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #ffffff 100%);
        }
        .form-glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="max-w-4xl w-full grid md:grid-cols-2 shadow-2xl rounded-3xl overflow-hidden bg-white">
        
        <div class="bg-blue-600 p-10 text-white flex flex-col justify-between">
            <div>
                <div class="flex items-center gap-2 mb-8">
                    <span class="text-3xl">⚓</span>
                    <span class="text-2xl font-bold">DoubtDock</span>
                </div>
                <h2 class="text-3xl font-bold leading-tight">Start Your Engineering Journey With Us.</h2>
                <p class="mt-4 text-blue-100">Access verified resources and connect with top mentors in real-time.</p>
            </div>
            
            <div class="mt-8 p-4 bg-blue-700/50 rounded-2xl border border-blue-400/30">
                <p class="italic text-sm">"उद्यमेन हि सिध्यन्ति कार्याणि न मनोरथैः।"</p>
                <p class="text-[10px] uppercase tracking-widest mt-2 opacity-70">— Success through effort</p>
            </div>
        </div>

        <div class="p-10 bg-white">
            <h3 class="text-2xl font-bold text-slate-800 mb-2">Create Account</h3>
            <p class="text-slate-500 text-sm mb-8">Join the community of 10k+ engineers.</p>

            <form action="#" class="space-y-4">
                <div class="flex gap-4 mb-6">
                    <label class="flex-1">
                        <input type="radio" name="role" value="student" class="hidden peer" checked>
                        <div class="text-center p-3 rounded-xl border-2 border-slate-100 peer-checked:border-blue-600 peer-checked:bg-blue-50 cursor-pointer transition">
                            <span class="block text-sm font-bold">Student</span>
                        </div>
                    </label>
                    <label class="flex-1">
                        <input type="radio" name="role" value="mentor" class="hidden peer">
                        <div class="text-center p-3 rounded-xl border-2 border-slate-100 peer-checked:border-blue-600 peer-checked:bg-blue-50 cursor-pointer transition">
                            <span class="block text-sm font-bold">Mentor</span>
                        </div>
                    </label>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-bold text-slate-500 ml-1">Full Name</label>
                        <input type="text" placeholder="John Doe" class="w-full mt-1 p-3 bg-slate-50 rounded-xl border-none focus:ring-2 focus:ring-blue-400 outline-none text-sm">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 ml-1">Branch</label>
                        <select class="w-full mt-1 p-3 bg-slate-50 rounded-xl border-none focus:ring-2 focus:ring-blue-400 outline-none text-sm appearance-none">
                            <option>CS / IT</option>
                            <option>Mechanical</option>
                            <option>Civil</option>
                            <option>Electrical</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-500 ml-1">Email Address</label>
                    <input type="email" placeholder="name@college.edu" class="w-full mt-1 p-3 bg-slate-50 rounded-xl border-none focus:ring-2 focus:ring-blue-400 outline-none text-sm">
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-500 ml-1">Password</label>
                    <input type="password" placeholder="••••••••" class="w-full mt-1 p-3 bg-slate-50 rounded-xl border-none focus:ring-2 focus:ring-blue-400 outline-none text-sm">
                </div>

                <div class="flex items-center gap-2 py-2">
                    <input type="checkbox" id="terms" class="rounded text-blue-600">
                    <label for="terms" class="text-[10px] text-slate-500">I agree to the Terms & Conditions and Privacy Policy.</label>
                </div>

                <button class="w-full py-4 bg-blue-600 text-white rounded-xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 transition transform active:scale-95">
                    Sign Up Now
                </button>

                <p class="text-center text-xs text-slate-500 mt-6">
                    Already have an account? <a href="#" class="text-blue-600 font-bold">Log In</a>
                </p>
            </form>
        </div>
    </div>

</body>
</html>
